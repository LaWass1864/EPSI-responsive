<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unités vw et vh</title>
  <style>
    /*
      VW / VH : relatif à la fenêtre.
      1vw = 1 % de la largeur de la fenêtre ; 1vh = 1 % de sa hauteur.
      Question à se poser : « Ça doit suivre la taille de l'écran ? »
      Usage : section d'accueil, titre géant.
    */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }

    .hero {
      height: 60vh;               /* 60 % de la hauteur de la fenêtre */
      border: 2px solid #1f5f4a;    /* bordure de la section */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #e8f1ee;
    }

    .hero h1 {
      font-size: 6vw;             /* 6 % de la largeur de la fenêtre */
      border: 1px dashed #f2a541;   /* bordure du titre */
      color: #1f5f4a;
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Vélos Lumière</h1>
    <p>Réduisez la fenêtre : la section et le titre changent de taille.</p>
  </section>
  <!-- Repère en px : taille fixe, pour comparer -->
  <div style="width: 300px; padding: 8px; border: 1px solid #1f5f4a;">Repère px : 300 px fixes</div>
</body>
</html>
