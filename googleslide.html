<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-do corrections Google Slides</title>
<style>
  :root { --bg: #FBFBF8; --fg: #14213D; --muted: #4A5568; --rule: #D9DEE3; --accent: #0F766E; --card: #FFFFFF; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans", Arial, sans-serif; font-size: 16px; line-height: 1.5; padding: 24px 16px 48px; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-family: "Source Serif 4", Georgia, serif; font-size: 32px; line-height: 1.2; margin: 0 0 8px; }
  .intro { color: var(--muted); margin: 0 0 24px; }
  h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 28px 0 8px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-bottom: 1px solid var(--rule); }
  label { display: flex; gap: 12px; align-items: flex-start; padding: 12px 2px; cursor: pointer; }
  input[type="checkbox"] { flex: none; width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); }
  .step { min-width: 0; }
  .slide { display: inline-block; font-size: 13px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0 8px; margin-right: 6px; white-space: nowrap; }
  .why { display: block; color: var(--muted); font-size: 15px; margin-top: 2px; }
  @media print { body { padding: 0; } h2 { break-after: avoid; } li { break-inside: avoid; } }
</style>
</head>
<body>
<main>
  <h1>To-do corrections Google Slides</h1>
  <p class="intro">Présentation de la Résidence Galéa à corriger avant jeudi 12/11. Cochez chaque point une fois corrigé.</p>

  <h2>1. Contenu</h2>
  <ul>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 2</span>Corriger la tranche de dépendance<span class="why">« niveau 6 et 3 » est inversé et imprécis : la grille AGGIR va de 1 à 6.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 2</span>Corriger les fautes<span class="why">« Chaque chambres » devient « Chaque chambre » ; « propice » est à vérifier dans la phrase sur les terrasses.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 3</span>Vérifier et justifier l'âge minimum<span class="why">44 ans : une structure pour personnes âgées accueille en général à partir de 60 ans.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 3</span>Corriger « FITNESS » en « FINESS »<span class="why">Le numéro FINESS doit apparaître avec ce nom exact.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 4</span>Vérifier le seuil d'accessoire<span class="why">80 011 € correspond à 2025 : vérifier le montant pour l'année en cours.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 5</span>Corriger les missions<span class="why">« Proposer des activités quotidiens » est une faute d'accord. Harmonisez la forme des trois missions (une phrase, un nom, un verbe).</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 6</span>Supprimer le doublon<span class="why">« Confidentialité » et « Écoute et confidentialité » figurent deux fois.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 11</span>Préciser le prix de location<span class="why">« 1600 € m2 » : indiquer s'il s'agit d'un prix mensuel ou annuel.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 11</span>Expliciter l'exonération<span class="why">« Exonération possible : CCAS » est peu clair : préciser ce que couvre le CCAS.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 12</span>Ne pas répéter l'objectif<span class="why">« Continuer le maintien de l'autonomie » apparaît pour l'établissement et pour la santé.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Toutes</span>Choisir une seule graphie du nom<span class="why">Galéa, GALEA ou GAÉLA : garder la même partout.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 13</span>Vérifier la photo<span class="why">Elle doit correspondre à la structure, ou être remplacée.</span></span></label></li>
  </ul>

  <h2>2. Design</h2>
  <ul>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 2</span>Ajouter une photo et des icônes<span class="why">Photo de la façade, et une icône pour chacune des trois idées clés.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 3</span>Présenter l'identité en cartes<span class="why">Une icône par ligne : bâtiment, adresse, statut, téléphone, FINESS, SIRET.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 3</span>Ajouter une capture Google Maps<span class="why">Avec « Source : Google Maps » en bas de la diapositive.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 4</span>Icônes pour le statut et le seuil<span class="why">Mettre 80 011 € en valeur.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 5-6</span>Une icône par mission et par valeur<span class="why">Taille de texte uniforme sur les deux diapositives.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 7</span>Pictogrammes du public<span class="why">Deux pictogrammes (autonome, dépendante) et la source en pied de page.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 8</span>Icônes du tableau<span class="why">Une icône par ligne, cellules aérées.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 9</span>Icônes de l'offre<span class="why">Une icône par bloc ; agrandir les puces et supprimer le chevauchement.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 10</span>Icônes des moyens<span class="why">Quatre icônes ; corriger le débordement du titre « Moyens organisationnels ».</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 11</span>Mettre en valeur le budget<span class="why">Lignes clés en évidence et une barre recettes / plafond.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Diap. 12</span>Icônes ou frise des objectifs<span class="why">Une icône par domaine, ou une frise : aujourd'hui, six mois, un an.</span></span></label></li>
    <li><label><input type="checkbox"><span class="step"><span class="slide">Toutes</span>Harmoniser la mise en page<span class="why">Même palette, mêmes marges, même police. Images libres de droits ou autorisées, sans résident identifiable.</span></span></label></li>
  </ul>
</main>
</body>
</html>
