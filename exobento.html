<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corrigé : galerie bento</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #fbfbf8;
      color: #1a1a1a;
    }

    h1 {
      font-family: Georgia, serif;
      color: #1f5f4a;
      font-size: 2rem;
    }

    /* 1. Mobile d'abord : une colonne, des lignes de 200 px */
    .bento {
      display: grid;
      grid-template-columns: 1fr;
      grid-auto-rows: 200px;
      gap: 12px;
    }

    /* 2. Rogner les coins : l'image ne sort pas de la case */
    .bento figure {
      margin: 0;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
    }

    /* 3. Remplir la case sans déformer l'image */
    .bento img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 4. Légende en bas de l'image, sur fond foncé */
    .bento figcaption {
      position: absolute;
      left: 0;
      bottom: 0;
      padding: 4px 8px;
      background: #1f5f4a;
      color: #ffffff;
      font-size: 0.9rem;
    }

    /* 5. À partir de 768 px : trois colonnes */
    @media (min-width: 768px) {
      .bento {
        grid-template-columns: repeat(3, 1fr);
      }

      /* 6. Le grand bloc : 2 colonnes et 2 lignes */
      .bento .grand {
        grid-column: span 2;
        grid-row: span 2;
      }

      /* 7. Le bloc large : 2 colonnes */
      .bento .large {
        grid-column: span 2;
      }
    }
  </style>
</head>
<body>
  <h1>Galerie bento</h1>

  <main>
    <section class="bento">
      <figure class="grand">
        <img src="https://picsum.photos/seed/bento1/800/600" alt="Vélo de ville garé devant une vitrine">
        <figcaption>Grand bloc</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/seed/bento2/400/400" alt="Café servi dans une tasse blanche">
        <figcaption>Café</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/seed/bento3/400/400" alt="Pain au levain coupé en deux">
        <figcaption>Pain</figcaption>
      </figure>

      <figure class="large">
        <img src="https://picsum.photos/seed/bento4/800/400" alt="Route de campagne bordée d'arbres">
        <figcaption>Bloc large</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/seed/bento5/400/400" alt="Fleurs jaunes dans un pot">
        <figcaption>Fleurs</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/seed/bento6/400/400" alt="Carnet et stylo sur une table">
        <figcaption>Carnet</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
